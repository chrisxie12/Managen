name: Build & Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schoolos-frontend/src/**'
      - 'schoolos-frontend/public/**'
      - 'schoolos-frontend/index.html'
      - 'schoolos-frontend/vite.config.*'
      - 'schoolos-frontend/package.json'
      - 'schoolos-frontend/pnpm-lock.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: schoolos-frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: schoolos-frontend
        env:
          VITE_API_BASE_URL: https://api.getschoolos.me
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm run build

      - name: Commit updated dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schoolos-frontend/dist/
          if git diff --cached --quiet; then
            echo "dist/ unchanged, skipping commit"
          else
            git commit -m "chore: auto-build dist/ [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Trigger DigitalOcean deployment
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          if [ -z "$DO_TOKEN" ] || [ -z "$DO_APP_ID" ]; then
            echo "DO_TOKEN or DO_APP_ID not set — skipping. Add them as repo secrets to enable auto-deploy."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments")
          echo "DO deploy triggered: HTTP $STATUS"
          echo "Waiting 90s for DO to finish building..."
          sleep 90

      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CF_TOKEN or CF_ZONE_ID not set — skipping. Add them as repo secrets to enable auto cache purge."
            exit 0
          fi
          STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare purge: HTTP $STATUS"
          cat response.json
