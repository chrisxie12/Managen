<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SchoolOS Blog</title>
    <style>
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #fff3e6; color: #381932; }
      .wrap { width: min(960px, 92vw); margin: 0 auto; padding: 64px 0; }
      .post { background: #fff; border: 1px solid rgba(56,25,50,.1); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      h1 { margin: 0 0 12px; font-size: clamp(32px,5vw,48px); }
      p { color: #64748b; margin: 6px 0 0; }
      .meta { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Blog</h1>
      <article class="post">
        <div class="meta">Product</div>
        <h3>How schools cut admin overhead with unified workflows</h3>
        <p>A practical guide to reducing spreadsheet operations across academics and finance.</p>
      </article>
      <article class="post">
        <div class="meta">Operations</div>
        <h3>Best practices for fee reminder campaigns</h3>
        <p>How to design payment reminders that improve collections without frustrating parents.</p>
      </article>
    </main>
  </body>
</html>
