<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SchoolOS Careers</title>
    <style>
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: #fff3e6; color: #381932; }
      .wrap { width: min(920px, 92vw); margin: 0 auto; padding: 64px 0; }
      .card { background: #fff; border: 1px solid rgba(56,25,50,.1); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
      h1 { margin: 0 0 12px; font-size: clamp(32px,5vw,48px); }
      p { color: #64748b; }
      .btn { display: inline-block; text-decoration: none; border-radius: 999px; padding: 10px 16px; font-weight: 700; background: linear-gradient(135deg,#381932,#512b4a); color: #fff3e6; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Careers</h1>
      <article class="card">
        <h3>Join our mission</h3>
        <p>We are building software infrastructure for schools across Africa and looking for builders who care about outcomes.</p>
      </article>
      <article class="card">
        <h3>Open applications</h3>
        <p>Email your profile and role interest to <a href="mailto:support@schoolos.app">support@schoolos.app</a>.</p>
      </article>
      <p><a class="btn" href="mailto:support@schoolos.app">Send application</a></p>
    </main>
  </body>
</html>
