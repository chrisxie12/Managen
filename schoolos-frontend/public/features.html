<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SchoolOS Features</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff3e6;
        color: #381932;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        background: #ffffff;
        border: 1px solid rgba(56, 25, 50, 0.12);
        border-radius: 20px;
        padding: 28px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #64748b;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, #381932, #512b4a);
        color: #fff3e6;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
      }
      .small {
        margin-top: 14px;
        font-size: 14px;
      }
      .small a {
        color: #512b4a;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>SchoolOS Features</h1>
        <p>Open the features section directly on the SchoolOS landing page.</p>
        <a class="btn" href="https://www.getschoolos.me/#features">View Features</a>
        <p class="small">
          Direct link:
          <a href="https://www.getschoolos.me/#features">https://www.getschoolos.me/#features</a>
        </p>
      </section>
    </main>
  </body>
</html>
