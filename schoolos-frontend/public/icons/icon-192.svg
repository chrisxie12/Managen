<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background tile -->
  <rect width="192" height="192" rx="36" fill="#07143B"/>

  <!-- Outer hexagon fill (pointy-top) -->
  <polygon points="96,18 163,57 163,135 96,174 29,135 29,57" fill="#0A2472"/>

  <!-- Inner hexagon border glow -->
  <polygon points="96,24 157,61 157,131 96,168 35,131 35,61"
           fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Bold S letterform -->
  <!-- Top curve of S -->
  <path d="M 68 80
           C 68 62, 80 54, 96 54
           C 112 54, 124 62, 124 75
           C 124 86, 116 92, 96 98
           C 76 104, 68 110, 68 122
           C 68 135, 80 144, 96 144
           C 112 144, 125 136, 125 122"
        stroke="white" stroke-width="16" fill="none"
        stroke-linecap="round"/>

  <!-- Book waves (open book motif at bottom) -->
  <line x1="64" y1="156" x2="128" y2="156" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="163" x2="124" y2="163" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>

  <!-- Dot accents at hex vertices -->
  <circle cx="96" cy="18" r="4.5" fill="#3B82F6"/>
  <circle cx="163" cy="57" r="3.5" fill="#1D4ED8"/>
  <circle cx="163" cy="135" r="3.5" fill="#1D4ED8"/>
  <circle cx="96" cy="174" r="4.5" fill="#3B82F6"/>
  <circle cx="29" cy="135" r="3.5" fill="#1D4ED8"/>
  <circle cx="29" cy="57" r="3.5" fill="#1D4ED8"/>
</svg>
