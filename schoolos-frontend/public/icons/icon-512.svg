<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="#07143B"/>

  <!-- Outer hexagon fill (pointy-top) -->
  <polygon points="256,48 435,152 435,360 256,464 77,360 77,152" fill="#0A2472"/>

  <!-- Inner hexagon border glow -->
  <polygon points="256,64 419,163 419,349 256,448 93,349 93,163"
           fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>

  <!-- Bold S letterform -->
  <path d="M 182 213
           C 182 165, 214 144, 256 144
           C 298 144, 330 165, 330 200
           C 330 229, 309 245, 256 261
           C 203 277, 182 293, 182 325
           C 182 360, 214 380, 256 380
           C 298 380, 332 360, 332 325"
        stroke="white" stroke-width="42" fill="none"
        stroke-linecap="round"/>

  <!-- Book waves -->
  <line x1="170" y1="415" x2="342" y2="415" stroke="#3B82F6" stroke-width="11" stroke-linecap="round"/>
  <line x1="182" y1="434" x2="330" y2="434" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>

  <!-- Dot accents at hex vertices -->
  <circle cx="256" cy="48" r="12" fill="#3B82F6"/>
  <circle cx="435" cy="152" r="9" fill="#1D4ED8"/>
  <circle cx="435" cy="360" r="9" fill="#1D4ED8"/>
  <circle cx="256" cy="464" r="12" fill="#3B82F6"/>
  <circle cx="77" cy="360" r="9" fill="#1D4ED8"/>
  <circle cx="77" cy="152" r="9" fill="#1D4ED8"/>
</svg>
