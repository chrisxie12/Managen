<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0069FF"/>
      <stop offset="100%" stop-color="#003A8C"/>
    </linearGradient>
  </defs>

  <!-- Icon: simple "D" droplet shape inspired by DigitalOcean style -->
  <circle cx="38" cy="45" r="32" fill="url(#blueGrad)"/>
  <!-- Letter S inside circle -->
  <text x="38" y="57"
    font-family="Arial, Helvetica, sans-serif"
    font-size="36"
    font-weight="800"
    text-anchor="middle"
    fill="#FFFFFF">S</text>

  <!-- Wordmark -->
  <!-- "School" in dark navy -->
  <text x="86" y="62"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#1A1A2E"
    letter-spacing="-0.5">School</text>

  <!-- "OS" in Ocean Blue -->
  <text x="300" y="62"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#0069FF"
    letter-spacing="-0.5">OS</text>
</svg>
