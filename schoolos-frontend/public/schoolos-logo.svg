<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60" fill="none">
  <!-- Hexagonal badge (pointy-top), navy fill -->
  <polygon points="28,2 52,16 52,44 28,58 4,44 4,16" fill="#0A2472"/>

  <!-- Inner hex border glow -->
  <polygon points="28,6 48,18 48,42 28,54 8,42 8,18"
           fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- S letterform -->
  <path d="M 19 24
           C 19 17, 23 14, 28 14
           C 33 14, 37 17, 37 22
           C 37 26, 34 28, 28 30
           C 22 32, 19 34, 19 38
           C 19 43, 23 46, 28 46
           C 33 46, 37 43, 37 38"
        stroke="white" stroke-width="5" fill="none"
        stroke-linecap="round"/>

  <!-- Book waves -->
  <line x1="18" y1="51" x2="38" y2="51" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="36" y2="55" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>

  <!-- Dot accents -->
  <circle cx="28" cy="2"  r="2"   fill="#3B82F6"/>
  <circle cx="52" cy="16" r="1.5" fill="#1D4ED8"/>
  <circle cx="52" cy="44" r="1.5" fill="#1D4ED8"/>
  <circle cx="28" cy="58" r="2"   fill="#3B82F6"/>
  <circle cx="4"  cy="44" r="1.5" fill="#1D4ED8"/>
  <circle cx="4"  cy="16" r="1.5" fill="#1D4ED8"/>
</svg>
