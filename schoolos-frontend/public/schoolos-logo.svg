<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" fill="none">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031B4E"/>
      <stop offset="50%" stop-color="#0069D9"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0069D9"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <!-- S icon mark -->
  <g transform="translate(0, 5)">
    <path d="M 20,45 C 20,22 36,10 55,10 C 74,10 85,22 85,35 C 85,48 74,55 60,58 L 50,60 C 42,62 38,67 42,73 C 46,79 55,82 65,78 C 72,75 78,68 78,60"
          fill="none" stroke="url(#sGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 78,55 C 78,68 65,82 45,82 C 25,82 12,68 12,55 C 12,42 22,36 36,33 L 46,31 C 54,29 58,24 54,18 C 50,12 41,10 32,14 C 25,17 20,24 20,32"
          fill="none" stroke="url(#sGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="49" cy="46" r="5" fill="#FFFFFF"/>
  </g>

  <!-- "School" in Dark Navy -->
  <text x="105" y="68"
    font-family="'Segoe UI', Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#111827">School</text>

  <!-- "OS" in DigitalOcean Blue -->
  <text x="333" y="68"
    font-family="'Segoe UI', Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="url(#osGrad)">OS</text>

  <!-- Tagline in Slate Gray -->
  <text x="106" y="84"
    font-family="'Segoe UI', Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="2.5"
    fill="#6B7280">ONE SYSTEM. EVERY SCHOOL.</text>
</svg>
